[package]
publish = false
name = "pse-metatron"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Metatron-scaffold topology scanner and Periodic-Table-of-Graphs library for PSE (vendored from metatron-scan, MIT)"
rust-version.workspace = true

[dependencies]
pse-fmath = { path = "../pse-fmath" }
pse-types = { path = "../pse-types", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
sha2 = { workspace = true }
nalgebra = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
indexed-signature = []
memoized-signature = ["indexed-signature"]
