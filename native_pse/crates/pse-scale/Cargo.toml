[package]
publish = false
name = "pse-scale"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Multi-scale observation, Kuramoto clustering, Fiedler bisection for PSE"
rust-version.workspace = true

[dependencies]
pse-fmath = { path = "../pse-fmath" }
pse-types = { path = "../pse-types", version = "0.1.0" }
pse-graph = { path = "../pse-graph", version = "0.1.0" }
pse-topology = { path = "../pse-topology", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
