[package]
publish = false
name = "pse-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "DomainAdapter trait and Engine orchestrator for PSE"
rust-version.workspace = true

[dependencies]
pse-fmath = { path = "../pse-fmath" }
pse-types = { path = "../pse-types", version = "0.1.0" }
pse-graph = { path = "../pse-graph", version = "0.1.0" }
pse-extract = { path = "../pse-extract", version = "0.1.0" }
pse-cascade = { path = "../pse-cascade", version = "0.1.0" }
pse-evidence = { path = "../pse-evidence", version = "0.1.0" }
pse-constraint = { path = "../pse-constraint", version = "0.1.0" }
pse-topology = { path = "../pse-topology", version = "0.1.0" }
pse-scale = { path = "../pse-scale", version = "0.1.0" }
pse-navigator = { path = "../pse-navigator", version = "0.1.0" }
pse-memory = { path = "../pse-memory", version = "0.1.0" }
pse-metatron = { path = "../pse-metatron", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
indexed-signature = ["pse-metatron/indexed-signature"]
memoized-signature = ["indexed-signature", "pse-metatron/memoized-signature"]
phase-hoist = ["pse-topology/phase-hoist"]
shared-spectrum = ["pse-topology/shared-spectrum"]
